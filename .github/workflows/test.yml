name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@master
      - run: brew install --formula ./Formula/everystate.rb
        working-directory: ${{ github.workspace }}
      - run: brew test everystate
      - run: brew audit --strict everystate
