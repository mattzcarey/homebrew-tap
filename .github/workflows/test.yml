name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      # Checks this repository out as the tap mattzcarey/tap.
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew install mattzcarey/tap/everystate
      - run: brew test mattzcarey/tap/everystate
      - run: brew audit --strict mattzcarey/tap/everystate
