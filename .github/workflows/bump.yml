# Updates each formula to the latest release of its project, every hour and from the Actions tab.
name: Bump
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: bump
        run: scripts/bump.sh everystate mattzcarey/everystate | tee "$RUNNER_TEMP/bump.txt"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "$(cat "$RUNNER_TEMP/bump.txt")"
          git push
